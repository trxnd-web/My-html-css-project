<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dce8ff, #f5f0e9);
      color: #333;
    }

    .form-container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 30px 36px;
      background: #fffaf3;
      border: 1px solid #c9c6d2;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(38, 42, 75, 0.15);
    }

    h1 {
      margin: 8px 0 28px;
      text-align: center;
      color: #34365f;
      font-size: 32px;
    }

    h1 span {
      color: #e66b6b;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label,
    .group-label {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #aaa9b6;
      border-radius: 8px;
      background: #fff;
      color: #333;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #666bb2;
      box-shadow: 0 0 0 3px rgba(102, 107, 178, 0.15);
    }

    .radio-options {
      padding: 4px 0 0 10px;
    }

    .radio-options label {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 8px 0 0;
      font-size: 18px;
      font-weight: 600;
    }

    input[type="radio"] {
      width: 17px;
      height: 17px;
      accent-color: #555da4;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 8px;
      background: #555da4;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #3e467f;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }

      .form-container {
        padding: 24px 18px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="form-container">
    <h1>Student <span>Registration</span> Form</h1>

    <form action="#" method="post">
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="fullName"
               placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required>
      </div>

      <fieldset class="form-group" style="border: 0; padding: 0; margin-left: 0; margin-right: 0;">
        <legend class="group-label">Gender</legend>
        <div class="radio-options">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">Select Department</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Business Administration">Business Administration</option>
          <option value="Accounting">Accounting</option>
          <option value="Mass Communication">Mass Communication</option>
          <option value="Engineering">Engineering</option>
        </select>
      </div>

      <div class="form-group">
        <label for="bio">Short Bio</label>
        <textarea id="bio" name="bio"
                  placeholder="Write a short bio about yourself" required></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
